name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

      - name: Build production bundle
        run: npm run build
        working-directory: frontend
        env:
          VITE_STACKS_NETWORK: mainnet
          VITE_DEPLOYER_ADDRESS: ${{ secrets.MAINNET_DEPLOYER_ADDRESS }}
          VITE_APP_NAME: REXONOBIT

      - name: Archive frontend dist
        run: |
          cd frontend
          zip -r ../rexonobit-frontend-${{ github.ref_name }}.zip dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: rexonobit-frontend-${{ github.ref_name }}.zip
          body: |
            ## REXONOBIT ${{ github.ref_name }}

            Stacks Micro-Economy Protocol release.

            ### Deployment
            - Frontend archive attached — deploy `dist/` to your static host.
            - Contract deployment: `make deploy-mainnet` (requires `STACKS_PRIVATE_KEY`).

            See [CHANGELOG.md](CHANGELOG.md) for full release notes.
